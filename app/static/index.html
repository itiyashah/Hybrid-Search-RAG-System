<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart AI Assistant</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --user-msg: #2563eb;
            --bot-msg: #334155;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #475569;
            --accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: var(--card-bg);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        header {
            padding: 1.2rem;
            background: #0f172a;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        header h2 {
            color: var(--accent);
            font-size: 1.4rem;
        }

        .chat-box {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 1rem;
            border-radius: 10px;
            line-height: 1.5;
            white-space: pre-wrap;
            font-size: 0.95rem;
        }

        .user-message {
            align-self: flex-end;
            background: var(--user-msg);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .bot-message {
            align-self: flex-start;
            background: var(--bot-msg);
            color: var(--text-color);
            border-bottom-left-radius: 2px;
            border: 1px solid var(--border-color);
        }

        .loading {
            align-self: flex-start;
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.9rem;
        }

        .input-area {
            padding: 1rem;
            background: #0f172a;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 0.5rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: white;
            outline: none;
            font-size: 1rem;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        button {
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="chat-container">
        <header>
            <h2>🔍 Smart AI Research Assistant</h2>
        </header>

        <div class="chat-box" id="chatBox">
            <div class="message bot-message">Hello! Ask me any question based on your uploaded document library.</div>
        </div>

        <form class="input-area" id="chatForm">
            <input type="text" id="userInput" placeholder="Ask a question..." required autocomplete="off">
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const sessionId = "web_session_" + Math.random().toString(36).substring(7);

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const question = userInput.value.trim();
            if (!question) return;

            // Append User Message
            appendMessage(question, 'user-message');
            userInput.value = '';

            // Append Loading Indicator
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading';
            loadingDiv.textContent = '⚡ Searching documents & generating response...';
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question, session_id: sessionId })
                });

                const data = await response.json();
                chatBox.removeChild(loadingDiv);

                if (response.ok) {
                    appendMessage(data.answer, 'bot-message');
                } else {
                    appendMessage("❌ Error: " + (data.detail || "Failed to process request."), 'bot-message');
                }
            } catch (err) {
                chatBox.removeChild(loadingDiv);
                appendMessage("❌ Network Error: Could not connect to the server.", 'bot-message');
            }
        });

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>

</body>

</html>
